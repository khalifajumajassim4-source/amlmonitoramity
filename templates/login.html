<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - AML Monitoring System</title>
    <!-- Same fonts and stylesheet as the rest of the app (reuse the dark theme) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- Standalone layout: no sidebar/nav because the user isn't logged in yet -->
<body class="login-page">
    <div class="login-wrap">
        <div class="card login-card">

            <!-- App name / logo at the top -->
            <div class="login-brand">
                <span class="brand-mark">AML</span>
                <span class="brand-text">AML Monitoring System</span>
            </div>
            <p class="page-subtitle">Sign in to access the compliance console</p>

            <!-- Flash messages (e.g. "Invalid username or password.") -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <!-- Login form posts to /login -->
            <form method="POST" action="{{ url_for('login') }}" class="login-form">
                <label class="field">
                    <span>Username</span>
                    <input type="text" name="username" autofocus required>
                </label>

                <label class="field">
                    <span>Password</span>
                    <input type="password" name="password" required>
                </label>

                <button type="submit" class="btn btn-primary login-submit">Sign In</button>
            </form>

        </div>
    </div>
</body>
</html>
